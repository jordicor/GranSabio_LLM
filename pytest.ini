[pytest]
testpaths = dev_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Per-test ceiling (pytest-timeout). The slowest tests take about 10s (the
# PowerShell launcher checks, whose own subprocess budget is 25s + 5s).
timeout = 60
addopts = -v --tb=short --strict-markers -m "not integration"
markers =
    unit: Unit tests (no external dependencies)
    integration: Live tests with real provider calls that cost money (some need the engine server at API_BASE). Deselected by default; opt in with -m integration
    slow: Tests that take >5 seconds
    api: API endpoint tests
filterwarnings =
    ignore::DeprecationWarning
